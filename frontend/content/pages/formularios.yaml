  below: O cadastro não garante aprovação nem reserva dinheiro. Não envie documentos, senhas ou dados bancários.
  consentOutdated: Os textos de consentimento foram atualizados. Recarregue a página para ler a versão atual antes de enviar.
  formExpired: Não conseguimos concluir o envio agora. Seus dados continuam no formulário. Tente enviar de novo em instantes.
  unavailable:
    title: O cadastro de aviso ainda não está aberto
    text: Por enquanto, este formulário não recebe cadastros e nenhum dado é coletado aqui. Quando o cadastro abrir, ele aparecerá nesta página.
    meanwhile: 'Enquanto isso, você pode:'
    links:
      - { to: /conteudos, label: Ler os conteúdos, text: 'Entenda CET, parcela, prazo e desconto em folha.' }
      - { to: /bia, label: Conhecer a Bia, text: Veja como nossa assistente de IA explica o crédito. }
      - { to: /atendimento, label: Falar com o atendimento, text: Tire dúvidas pelos canais oficiais. }

# Campo-armadilha anti-robô: fora da tela e escondido de leitores de tela (pessoas não o veem).
trap:
  label: Deixe este campo em branco

# Ações para falar com a Bia (chat do site primeiro; WhatsApp oficial como última alternativa).
bia:
  webchat: Conversar com a Bia no site
  whatsapp: Falar com a Bia no WhatsApp
  whatsappText: 'Olá, Bia! Quero falar com a Minha Folga.'
  newTab: (abre o WhatsApp em nova aba)
  fallback: Conhecer a Bia

# Pedido de saída sem link de preferências (POST /api/preferences/opt-out): resposta sempre genérica.
optOut:
  title: Pedir saída das comunicações
  text: Informe o número que recebe as mensagens. Se ele estiver na nossa lista, deixamos de enviar o aviso de abertura e os conteúdos e novidades para ele.
  privacy: Por segurança, esta tela não mostra se o número está cadastrado nem exibe dados.
  submit: Pedir saída
  done: Pedido registrado. Se este número estiver na nossa lista, ele não vai mais receber o aviso de abertura nem conteúdos e novidades da Minha Folga.
  another: Pedir saída para outro número

