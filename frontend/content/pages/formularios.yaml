# Textos dos formulários de relacionamento (cadastro de aviso, pedido de saída das comunicações e
# atendimento). Os textos de consentimento NÃO ficam aqui: vêm de contracts/consents.json,
# junto com a versão registrada pelo servidor. Textos entre chaves simples ({n}, {max}) são
# preenchidos pela interface; campos terminados em _mdi aceitam Markdown em linha (links).
# Decisão D1 (docs/DECISOES.md): cadastro com CPF e empregador, sem confirmação por código.
revision:
  version: 4
  status: draft
  draftedAt: 2026-09-26
  approvedAt: null
  approvedBy: null

common:
  requiredNote: Todos os campos são obrigatórios, exceto quando indicado.
  submitting: Enviando…
  checkFields: Confira os campos destacados.
  rateLimited: Muitas tentativas em pouco tempo. Aguarde alguns minutos e tente novamente.
  reload: Recarregar a página

waitlist:
