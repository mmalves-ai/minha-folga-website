    secondAnnouncement: Etapa 2 de 2. Informe seu trabalho e escolha os avisos.
  groups:
    person: Seus dados
    work: Trabalho e renda
    workHint: Conte um pouco sobre seu trabalho para prepararmos seu atendimento.
    place: Onde você mora
  name:
    label: Nome completo
    hint: Como está nos seus documentos.
    required: Informe seu nome completo.
    tooShort: Informe nome e sobrenome.
    tooLong: Use até 120 caracteres.
    invalid: Use só letras no nome, sem números, símbolos ou e-mail.
  cpf:
    label: CPF
    hint: 'Formato: 000.000.000-00.'
    purposeTitle: Para que usamos o CPF
    purpose: Para identificar seu cadastro e evitar duplicidade. Quando abrirmos, ele ajudará a verificar as opções para você. Este cadastro ainda não consulta crédito.
    required: Informe seu CPF.
    invalid: Confira o CPF.
  phone:
    label: WhatsApp com DDD
    hint: 'Exemplo: (11) 91234-5678.'
    required: Informe seu WhatsApp com DDD.
    invalid: Confira o DDD e o número.
  email:
    label: E-mail
    hint: 'Exemplo: nome@exemplo.com.br'
    invalid: Confira o e-mail.
    tooLong: Use até 160 caracteres.
  employer:
    label: Empresa onde você trabalha
    hint: Nome da empresa ou da pessoa que paga o seu salário.
    required: Informe o nome da empresa ou de quem paga o seu salário.
    tooShort: Use pelo menos 2 caracteres.
    tooLong: Use até 120 caracteres.
    invalid: Use só o nome da empresa, sem e-mail ou número de documento.
  employment:
    label: Tipo de vínculo de trabalho
    placeholder: Escolha uma opção
    required: Escolha a opção que mais combina com o seu vínculo.
  tenure:
    label: Tempo no emprego atual
    placeholder: Escolha uma faixa
    required: Escolha há quanto tempo você está no emprego atual.
  income:
    label: Faixa de salário líquido
    hint: O valor que cai na sua conta por mês, já com os descontos.
    placeholder: Escolha uma faixa
    required: Escolha uma faixa ou “Prefiro não informar”.
  city:
    label: Cidade
    required: Informe sua cidade.
    tooLong: Use até 80 caracteres.
    invalid: Use só letras no nome da cidade.
  uf:
    label: UF
    placeholder: Escolha
    required: Escolha a UF.
  topic:
    label: O que você quer entender melhor?
    none: Prefiro não responder
  optionalTag: Opcional
  age:
    label: Tenho 18 anos ou mais
    required: Para se cadastrar, confirme que você tem 18 anos ou mais.
  consents:
    legend: O que você quer receber pelo WhatsApp
    requiredTag: Necessário para o aviso
    optionalTag: Opcional
    required: Para receber o aviso de abertura, marque esta opção.
  privacy_mdi: Usaremos seus dados para as finalidades escolhidas e para a futura pré-análise de elegibilidade. Saiba quem cuida deles e como exercer seus direitos no [Aviso de Privacidade](/privacidade).
