# /preferencias — gestão de finalidades com acesso seguro (seções 6.15 e 9; decisão D1 em docs/DECISOES.md).
# Fora do sitemap, noindex. Nenhum dado de cadastro aparece sem sessão válida do titular, aberta pelo link
# seguro de uso único que a Bia gera na conversa pelo WhatsApp oficial (o número é atestado pelo canal).
# Sem o link, qualquer pessoa pode pedir a saída das comunicações informando o número, sem ver dados.
revision:
  version: 2
  status: draft
  draftedAt: 2026-09-26
  approvedAt: null
  approvedBy: null

meta:
  title: Preferências de comunicação
  description: Gerencie com o link seguro da Bia as comunicações que você recebe da Minha Folga, ajuste seus dados gerais, saia da lista de aviso ou peça a exclusão dos dados.

hero:
  breadcrumb: Preferências
  title: Suas preferências de comunicação
  lead: Escolha o que você quer receber da Minha Folga e mude de ideia quando quiser. Para proteger seus dados, suas escolhas só aparecem com o link seguro que a Bia envia na conversa.

checking: Conferindo seu acesso…
retry: Tentar novamente
linkInvalid: Este link de preferências expirou ou já foi usado. Peça um novo link à Bia.
loggedOut: Sessão encerrada neste navegador.
sessionEnded: Sua sessão terminou. Para continuar, peça um novo link seguro à Bia.

noLink:
  title: Peça seu link seguro à Bia
  text: 'Para ver e mudar suas escolhas, peça à Bia um link de preferências na conversa pelo WhatsApp oficial. Nesse canal, o próprio WhatsApp confirma que o número é seu. O link vale por {minutes} minutos e só pode ser usado uma vez.'
  steps:
    - Abra a conversa com a Bia no WhatsApp oficial.
    - Diga que quer mudar suas preferências.
    - Toque no link que a Bia enviar na conversa.
  unavailable: O pedido do link pela conversa com a Bia no WhatsApp ainda não está disponível. Enquanto isso, você pode pedir a saída das comunicações nesta página ou falar com o atendimento.
  whatsappText: 'Olá, Bia! Quero mudar minhas preferências de comunicação.'
  webchatNote: No chat do site, a Bia tira dúvidas, mas não consegue confirmar o seu número. Por isso, o link sai só pela conversa no WhatsApp.
  deletion_mdi: Para pedir a exclusão dos seus dados sem o link, fale com o [atendimento](/atendimento?assunto=privacidade).

security:
  title: Como protegemos o acesso
  items:
    - Suas escolhas só aparecem com um link seguro de uso único, que a Bia envia na conversa pelo WhatsApp oficial.
    - O pedido de saída pelo número não mostra dados nem confirma se o número está cadastrado.
    - Não pedimos CPF, documentos, senhas ou dados bancários para mudar preferências.
    - Ao terminar, encerre a sessão, principalmente em aparelhos compartilhados.
  links:
    - { label: Aviso de Privacidade, to: /privacidade }
    - { label: Segurança e canais oficiais, to: /seguranca }

