meta:
  title: Cadastro de interesse recebido
  description: Recebimento do cadastro de interesse na Minha Folga, próximos passos e um guia gratuito para comparar propostas de consignado com mais clareza.

hero:
  breadcrumb: Cadastro de interesse
  neutralTitle: Cadastro de interesse
  neutralLead: Esta página aparece logo depois do envio do cadastro de interesse. Não há um envio recente nesta aba.
  neutralActions:
    - { label: Quero entrar na fila, to: /avise-me }
    - { label: Gerenciar preferências, to: /preferencias }
