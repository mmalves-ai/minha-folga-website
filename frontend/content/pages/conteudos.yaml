      title: Quer entender esses termos em uma conversa?
      text: Conheça a Bia, nossa assistente de inteligência artificial, e veja como ela explica termos como CET, prazo e custo total em linguagem simples.
      primary: { label: Conhecer a Bia, to: /bia }
      secondary: { label: Ver a central de ajuda, to: /ajuda }
    ajuda:
      title: Ainda com dúvidas?
      text: A central de ajuda reúne respostas sobre o consignado, o cadastro de interesse e a segurança. Se precisar, fale com o atendimento.
      primary: { label: Ir para a central de ajuda, to: /ajuda }
      secondary: { label: Falar com o atendimento, to: /atendimento }
  notFound:
