meta:
  title: Minha Folga | Crédito para seus planos. Folga para seu mês.
  description: "Em breve: crédito novo ou uma oportunidade de aliviar suas parcelas, com IA a seu favor. Cadastre-se grátis na fila da Minha Folga."
hero:
  eyebrow: A próxima conversa sobre seu dinheiro pode ser mais clara.
  title: Seu salário merece uma folga. Sua escolha, mais inteligência.
  text: Informação clara e inteligência artificial para você entender melhor suas escolhas. Conheça a Minha Folga, converse com a Bia e acompanhe nossa proposta de crédito consignado para quem trabalha com carteira assinada.
  primary:
    label: Conheça nossas soluções
    to: /solucoes
  secondary:
    label: Conhecer a Bia
    to: /bia
