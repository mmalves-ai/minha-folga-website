solution:
  eyebrow: Nossa solução de crédito
  title: Consignado privado, com a situação sempre clara.
  text: Estamos preparando uma experiência de consignado privado para trabalhadores com vínculo formal elegível. A contratação ainda não está disponível. Enquanto a operação é estruturada, você pode entender como a modalidade funciona e receber o aviso de abertura.
  link:
    label: Conheça o consignado privado
    to: /consignado-privado
  nowTitle: O que já está disponível
  now:
    - text: Conteúdos para entender CET, prazo e total a pagar
    - text: Exemplos de conversa com a Bia
      requires: noBiaChannel
    - text: Conversa com a Bia no chat do site
      requires: webchat
    - text: Conversa com a Bia pelo WhatsApp
      requires: biaWhatsapp
    - text: Cadastro de interesse para o aviso de abertura
      requires: waitlist
    - text: Central de ajuda com as dúvidas mais comuns
  laterTitle: O que depende da abertura
  later:
    - Análise de propostas para os perfis atendidos
    - Consultas de dados e margem, somente com a sua autorização
    - Condições apresentadas com CET e total a pagar
    - Contratação, somente após aprovação e a sua decisão
  supportTitle: Serviços de apoio
  supportText: A Bia e os conteúdos ajudam você a entender o crédito antes de qualquer decisão. Não são produtos financeiros.
