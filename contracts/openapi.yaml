      operationId: agent_query_margin
      summary: Reservada.
      description: |-
        Reservada. Consulta de dados e margem somente após autorização específica e integração habilitada. A entrada não é lida nesta entrega.

        Fases permitidas: PILOT, LIVE. Exige remetente atestado pela plataforma (senderVerified). Requisitos adicionais: CREDIT_OPERATIONS_ENABLED=true; integração financeira homologada; autorização específica do titular.

        Contrato PROPOSTO (a confirmar com o fornecedor Hal-AI). Esquemas também em contracts/agent-tools.json.
      security:
        - agentApiKey: []
      parameters:
        - in: header
          name: X-API-Key
          required: true
          schema:
            type: string
          description: HALAI_INBOUND_API_KEY (comparação em tempo constante).
        - in: header
          name: X-MF-Timestamp
          required: false
          schema:
            type: string
            pattern: ^\d{10}$
          description: "Somente com assinatura configurada (HALAI_WEBHOOK_SECRET): epoch em segundos; tolerância de 300 s."
        - in: header
          name: X-MF-Signature
          required: false
          schema:
            type: string
          description: 'Somente com assinatura configurada: v1=<hex HMAC-SHA256(HALAI_WEBHOOK_SECRET, "<timestamp>.<corpo bruto>")>; lista separada por vírgula na rotação.'
        - in: header
          name: X-MF-Request-Id
          required: false
          schema:
            type: string
            pattern: ^[A-Za-z0-9._:-]{8,128}$
          description: Obrigatório com assinatura; opcional sem ela. Único por chamada; repetição → 409 replayed_request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/AgentToolEnvelope"
                - type: object
                  properties:
                    input:
                      $ref: "#/components/schemas/AgentInputQueryMargin"
      responses:
        "200":
          description: Resultado da ferramenta.
          content:
            application/json:
              schema:
                type: object
                required:
                  - ok
                  - tool
                  - result
                properties:
                  ok:
                    const: true
                  tool:
                    const: query_margin
                  result:
                    $ref: "#/components/schemas/AgentOutputQueryMargin"
        "400":
          description: "`validation_error (fields com o caminho, ex.: input.cpf)`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentToolError"
        "401":
          description: "`invalid_api_key`, `invalid_signature (com assinatura configurada)`, `stale_request (com assinatura configurada)`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentToolError"
        "403":
          description: "`credit_phase_locked (PRE_LAUNCH)`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentToolError"
        "404":
          description: "`not_found (ferramenta inexistente)`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentToolError"
        "409":
          description: "`replayed_request`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentToolError"
        "415":
          description: "`unsupported_media_type`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentToolError"
        "429":
          description: "`rate_limited`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentToolError"
        "500":
          description: "`internal_error`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentToolError"
        "503":
          description: "`agent_disabled`, `credit_unavailable (PILOT/LIVE sem integração)`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentToolError"
