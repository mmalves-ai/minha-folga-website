components:
  securitySchemes:
    adminSession: { type: apiKey, in: cookie, name: mf_admin }
    contactSession: { type: apiKey, in: cookie, name: mf_contact }
    agentApiKey: { type: apiKey, in: header, name: X-API-Key }

  parameters:
    Csrf:
      in: header
      name: X-CSRF-Token
      required: true
      description: Token da sessão administrativa (de /api/admin/auth/me ou do login). Obrigatório em métodos inseguros do admin.
      schema: { type: string }

  responses:
    ValidationError:
      description: '`validation_error` com `fields` { campo: mensagem }.'
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    RateLimited:
      description: '`rate_limited`.'
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Unauthorized:
      description: '`unauthorized` / `session_required`.'
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Forbidden:
      description: '`forbidden` (sem permissão; tentativa auditada).'
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NotFound:
      description: '`not_found`.'
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  schemas:
    Error:
      type: object
      required: [ error ]
      properties:
        error:
          type: object
          required: [ code, message ]
          properties:
            code: { type: string }
            message: { type: string }
            fields: { type: object, additionalProperties: { type: string } }
            attemptsRemaining: { type: integer }
            retryAfterSeconds: { type: integer }
        requestId: { type: string }

    Readiness:
      type: object
      properties:
        status: { type: string, enum: [ ready, not_ready ] }
        checks: { type: object, additionalProperties: { type: string, enum: [ ok, fail ] } }

    PublicConfig:
      type: object
      description: Ver backend/src/config/public.ts (lista permitida).
      properties:
        schemaVersion: { const: 1 }
        siteUrl: { type: string }
        environment: { type: string, enum: [ development, test, staging, production ] }
        credit: { type: object, properties: { phase: { type: string, enum: [ PRE_LAUNCH, PILOT, LIVE ] }, operationsEnabled: { type: boolean } } }
        identity: { type: object }
        channels:
          type: object
          properties:
            whatsappNumber: { type: [ string, 'null' ], description: 'Número oficial do WhatsApp hospedado na Hal-AI (botão flutuante, wa.me).' }
            biaOnWhatsapp: { type: boolean }
            humanSupport: { type: boolean }
            webchat:
              type: object
              description: 'Widget de webchat da Hal-AI (placeholder). Carregado só depois do clique, com aviso de tratamento; a CSP precisa liberar a origem de scriptUrl.'
              required: [ enabled, scriptUrl, widgetId ]
              properties:
                enabled: { type: boolean }
                scriptUrl: { type: [ string, 'null' ] }
                widgetId: { type: [ string, 'null' ] }
        collection: { type: object, properties: { waitlistEnabled: { type: boolean }, supportEnabled: { type: boolean } } }
        analyticsEnabled: { type: boolean }
        notices: { type: object }
        consentVersions: { type: object, properties: { launch_notice: { type: string }, marketing: { type: string } } }

    EmploymentType: { type: string, enum: [ clt, domestico, rural, outro ] }
    JobTenure: { type: string, enum: [ menos_3_meses, 3_a_12_meses, 1_a_3_anos, mais_3_anos ] }
    IncomeRange: { type: string, enum: [ ate_2000, 2000_a_4000, 4000_a_7000, acima_7000, nao_informar ] }
    Uf: { type: string, enum: [ AC, AL, AP, AM, BA, CE, DF, ES, GO, MA, MT, MS, MG, PA, PB, PR, PE, PI, RJ, RN, RS, RO, RR, SC, SP, SE, TO ] }
    InterestTopic: { type: string, enum: [ organizar_compromissos, entender_alternativa, entender_portabilidade, so_conhecer ] }
    LeadState:
      type: string
      description: 'D1: received (site, telefone não validado) → verified (a Bia atestou o número) → invited; laterais unsubscribed e expired. verification_pending, waiting e human_support só em cadastros anteriores à D1.'
      enum: [ received, verified, invited, unsubscribed, expired, verification_pending, waiting, human_support ]
    SupportState: { type: string, enum: [ received, in_progress, answered, closed ] }
    AdminRole: { type: string, enum: [ admin, support, privacy, marketing ] }
    PrivacyRequestType: { type: string, enum: [ access, correction, deletion, revocation, opposition, portability, information, other ] }

    AntiBot:
      type: object
      additionalProperties: false
      required: [ token, nonce ]
      properties:
        token: { type: string, maxLength: 512, description: 'De GET /api/form-token.' }
        nonce: { oneOf: [ { type: string, pattern: '^\d{1,16}$' }, { type: integer, minimum: 0 } ], description: 'Solução da prova de trabalho.' }

    FormToken:
      type: object
      required: [ token, challenge, difficultyBits, expiresInSeconds, minFillSeconds ]
      properties:
        token: { type: string }
        challenge: { type: string, pattern: '^[A-Za-z0-9_-]{22}$', description: '16 bytes em base64url.' }
        difficultyBits: { type: integer, description: 'contracts/validation.json → waitlist.antiBot.difficultyBits.' }
        expiresInSeconds: { type: integer }
        minFillSeconds: { type: integer }

    WaitlistRequest:
      type: object
      additionalProperties: false
      required: [ fullName, cpf, phone, employerName, employmentType, jobTenure, incomeRange, city, uf, ageConfirmed, consents, consentVersions, source, antiBot ]
      properties:
        fullName: { type: string, minLength: 5, maxLength: 120, description: 'Nome e sobrenome, sem números. Erro: "Informe seu nome completo (nome e sobrenome)."' }
        cpf: { type: string, maxLength: 20, description: 'Com ou sem pontuação; dígitos verificadores conferidos e sequências repetidas recusadas. Erro: "Confira o CPF."' }
        phone: { type: string, maxLength: 20, description: 'Celular com DDD; aceita máscara. Erro: "Confira o DDD e o número."' }
        email: { type: string, maxLength: 160, description: 'Opcional (vazio = sem e-mail). Erro: "Confira o e-mail."' }
        employerName: { type: string, minLength: 2, maxLength: 120, description: 'Nome da empresa empregadora.' }
        employmentType: { $ref: '#/components/schemas/EmploymentType' }
        jobTenure: { $ref: '#/components/schemas/JobTenure' }
        incomeRange: { $ref: '#/components/schemas/IncomeRange' }
        city: { type: string, maxLength: 80 }
        uf: { $ref: '#/components/schemas/Uf' }
        ageConfirmed: { const: true }
        interestTopic: { oneOf: [ { $ref: '#/components/schemas/InterestTopic' }, { type: 'null' } ] }
        consents:
          type: object
          additionalProperties: false
          required: [ launch_notice, marketing ]
          properties:
            launch_notice: { const: true }
            marketing: { type: boolean }
        consentVersions:
          type: object
          additionalProperties: false
          required: [ launch_notice, marketing ]
          properties:
            launch_notice: { type: string }
            marketing: { type: string }
        source: { type: string, description: 'Uma de contracts/validation.json → waitlist.sources.' }
        utm:
          type: object
          additionalProperties: false
          description: Somente chaves permitidas e valores no padrão de contracts/validation.json; nunca dados pessoais.
          properties:
            utm_source: { type: string }
            utm_medium: { type: string }
            utm_campaign: { type: string }
            utm_content: { type: string }
            utm_term: { type: string }
        antiBot: { $ref: '#/components/schemas/AntiBot' }
        website: { type: string, description: 'Campo-armadilha: sempre vazio para humanos. Preenchido → 201 genérico sem gravar.' }

    WaitlistReceived:
      type: object
      required: [ status, message ]
      properties:
        status: { const: received }
        message: { type: string, example: Recebemos seu cadastro. Vamos avisar quando a análise estiver disponível. Enquanto isso, você pode conversar com a Bia. }

    OptOutRequest:
      type: object
      additionalProperties: false
      required: [ phone, antiBot ]
      properties:
        phone: { type: string, maxLength: 20 }
        antiBot: { $ref: '#/components/schemas/AntiBot' }
        website: { type: string, description: 'Campo-armadilha.' }

    OptOutReceived:
      type: object
      required: [ status, message ]
      properties:
        status: { const: received }
        message: { type: string }

    Preferences:
      type: object
      required: [ preferredName, nameHint, contactHint, contactVerified, employmentType, state, purposes ]
      properties:
        preferredName: { type: string, description: Primeiro nome. }
        nameHint: { type: string, example: Ana P. S., description: 'Nome completo mascarado.' }
        contactHint: { type: string, example: '(11) •••••-••34' }
        contactVerified: { type: boolean, description: 'true depois que a própria pessoa falou com a Bia (número atestado).' }
        cpfHint: { type: [ string, 'null' ], example: '***.***.***-12' }
        emailHint: { type: [ string, 'null' ], example: 'a•••@e•••.com.br' }
        employerName: { type: [ string, 'null' ] }
        employmentType: { $ref: '#/components/schemas/EmploymentType' }
        jobTenure: { oneOf: [ { $ref: '#/components/schemas/JobTenure' }, { type: 'null' } ] }
        incomeRange: { oneOf: [ { $ref: '#/components/schemas/IncomeRange' }, { type: 'null' } ] }
        city: { type: [ string, 'null' ] }
        uf: { oneOf: [ { $ref: '#/components/schemas/Uf' }, { type: 'null' } ] }
        interestTopic: { oneOf: [ { $ref: '#/components/schemas/InterestTopic' }, { type: 'null' } ] }
        state: { $ref: '#/components/schemas/LeadState' }
        purposes:
          type: object
          properties:
            launch_notice: { $ref: '#/components/schemas/PurposeState' }
            marketing: { $ref: '#/components/schemas/PurposeState' }

    PurposeState:
      type: object
      properties:
        granted: { type: boolean }
        updatedAt: { type: string, format: date-time }
        consentTextVersion: { type: string }

    PreferencesPatch:
      type: object
      additionalProperties: false
      properties:
        purposes:
          type: object
          additionalProperties: false
          properties:
            launch_notice: { type: boolean }
            marketing: { type: boolean }
        consentVersions:
          type: object
          additionalProperties: false
          description: Obrigatório ao conceder (true) uma finalidade.
          properties:
            launch_notice: { type: string }
            marketing: { type: string }
        interestTopic: { oneOf: [ { $ref: '#/components/schemas/InterestTopic' }, { type: 'null' } ] }
        employmentType: { $ref: '#/components/schemas/EmploymentType' }
        jobTenure: { $ref: '#/components/schemas/JobTenure' }
        incomeRange: { $ref: '#/components/schemas/IncomeRange' }
        city: { type: string, maxLength: 80 }
        uf: { $ref: '#/components/schemas/Uf' }
        email: { type: [ string, 'null' ], maxLength: 160, description: 'null ou vazio remove o e-mail.' }

    SupportRequest:
      type: object
      additionalProperties: false
      required: [ name, contactMethod, contact, subject, message ]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        contactMethod: { type: string, enum: [ email, whatsapp ] }
        contact: { type: string, maxLength: 120, description: 'E-mail ("Confira o e-mail.") ou celular com DDD ("Confira o DDD e o número.").' }
        subject: { type: string, description: 'Uma de contracts/validation.json → support.subjects.' }
        message: { type: string, minLength: 10, maxLength: 2000 }

    SupportCreated:
      type: object
      required: [ protocol, trackingToken, status, message ]
      properties:
        protocol: { type: string, example: MF-7K3P-9QXA-2M }
        trackingToken: { type: string, description: Exibido uma única vez; compõe o link seguro de acompanhamento (fragmento da URL). }
        status: { const: received }
        message: { type: string }

    SupportStatus:
      type: object
      properties:
        protocol: { type: string }
        status: { $ref: '#/components/schemas/SupportState' }
        subject: { type: string }
        subjectLabel: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        timeline:
          type: array
          items:
            type: object
            properties:
              type: { type: string, enum: [ created, status_changed, reply ] }
              status: { $ref: '#/components/schemas/SupportState' }
              text: { type: [ string, 'null' ], description: Somente respostas marcadas como visíveis ao titular. }
              at: { type: string, format: date-time }

    ProductEvent:
      type: object
      additionalProperties: false
      required: [ name ]
      properties:
        name: { type: string, enum: [ page_section_view, article_read, help_search, help_search_empty, waitlist_start, waitlist_cta_click, waitlist_error, waitlist_confirmed, bia_demo_tab, bia_channel_click, support_form_start ] }
        dimension:
          type: string
          maxLength: 80
          description: |
