openapi: 3.1.0
info:
  title: API Minha Folga
  version: 1.1.0
  summary: Cadastro de interesse, preferências, atendimento, ferramentas da Bia (Hal-AI) e administração.
  description: |
    Contrato versionado entre `frontend/` (Vue) e `backend/` (Node/Express). Todas as rotas vivem sob `/api`,
    na mesma origem do site. Regras gerais:

    - Erros sempre em JSON: `{ "error": { "code", "message", "fields"? , ...extra }, "requestId" }`.
      `message` é texto em português que pode ser exibido ao usuário; `code` é estável.
    - Chamadas do navegador com método inseguro exigem `Content-Type: application/json` e, se houver
      cabeçalho `Origin`, que ela esteja na lista permitida (defesa CSRF de base).
    - Corpos com campos inesperados são recusados (`validation_error`). Limite de corpo: 16 KB em todas as rotas.
    - Web Push usa autorização independente de navegador, endpoint cifrado e token técnico do dono; ver notifications.openapi.yaml.
    - Sessões usam cookies `HttpOnly; Secure; SameSite=Strict` definidos pelo servidor. Nenhum token vai para
      `localStorage`, query string ou pixels. Dados pessoais nunca aparecem em URL.
    - Respostas de cadastro e de pedido de saída são genéricas: não revelam se um número ou CPF já está cadastrado.
    - Em `PRE_LAUNCH`, toda rota `/api/credit/*` responde 403 `credit_phase_locked`.

    Decisão D1 (docs/DECISOES.md, 26/09/2026): este sistema **não mexe com WhatsApp**. Número oficial, Bia, webchat,
    filas, operadores e templates são da plataforma Hal-AI; a Bia chama as rotas `/api/agent/*` com `X-API-Key`.
    Não há confirmação por código nem webhooks de mensagem. Formulários públicos usam o anti-robô próprio
    (`GET /api/form-token` + prova de trabalho + campo-armadilha `website`).
servers:
  - url: https://www.minhafolga.com.br
tags:
  - name: plataforma
  - name: cadastro
  - name: preferencias
  - name: atendimento
  - name: metricas
  - name: bia
  - name: credito
  - name: admin

paths:
  /api/notifications/config:
    $ref: './notifications.openapi.yaml#/paths/~1api~1notifications~1config'
  /api/notifications/subscriptions:
    $ref: './notifications.openapi.yaml#/paths/~1api~1notifications~1subscriptions'
  /api/admin/notifications:
    $ref: './notifications.openapi.yaml#/paths/~1api~1admin~1notifications'
  /api/admin/notifications/campaigns:
    $ref: './notifications.openapi.yaml#/paths/~1api~1admin~1notifications~1campaigns'
  /api/admin/notifications/campaigns/{id}/cancel:
    $ref: './notifications.openapi.yaml#/paths/~1api~1admin~1notifications~1campaigns~1{id}~1cancel'
  /api/admin/notifications/grants:
    $ref: './notifications.openapi.yaml#/paths/~1api~1admin~1notifications~1grants'
  /api/admin/notifications/grants/{id}:
    $ref: './notifications.openapi.yaml#/paths/~1api~1admin~1notifications~1grants~1{id}'
  /api/health:
    get:
      tags: [ plataforma ]
      summary: Estado mínimo do processo (sem versão, dados ou infraestrutura).
      responses:
        '200':
          description: Processo ativo.
          content:
            application/json:
              schema: { type: object, properties: { status: { const: ok } }, required: [ status ] }

  /api/internal/ready:
    get:
      tags: [ plataforma ]
      summary: Prontidão interna (banco e migrações). Protegida por token.
      parameters:
        - { in: header, name: X-Readiness-Token, required: true, schema: { type: string } }
      responses:
        '200': { description: Pronto., content: { application/json: { schema: { $ref: '#/components/schemas/Readiness' } } } }
        '503': { description: Dependência indisponível., content: { application/json: { schema: { $ref: '#/components/schemas/Readiness' } } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/public-config:
    get:
      tags: [ plataforma ]
      summary: Lista permitida de configuração pública (mesma usada no build do frontend).
      description: |
        `collection.waitlistEnabled` é calculado a cada pedido: fica `false` quando o formulário do site está pausado
        pelo painel (`/api/admin/collection`) ou fechado por `WAITLIST_FORM_ENABLED=false`. Cache de até 25 s.
      responses:
        '200': { description: Configuração pública., content: { application/json: { schema: { $ref: '#/components/schemas/PublicConfig' } } } }

  # ---------------------------------------------------------------------------------------------- anti-robô
  /api/form-token:
    get:
      tags: [ cadastro ]
      summary: Desafio assinado do anti-robô próprio (cadastro e pedido de saída). Nada é gravado até o uso.
      description: |
        `token` = `base64url(JSON payload) + "." + base64url(HMAC-SHA256(SESSION_SECRET, <payload codificado>))`, payload
        `{ v: 1, c: <challenge>, d: <difficultyBits>, iat: <epoch ms> }`. O navegador procura `nonce` (inteiro decimal, a
        partir de 0) tal que SHA-256(UTF-8("<challenge>:<nonce>")) tenha pelo menos `difficultyBits` bits zero à esquerda
        (Web Worker, JavaScript puro, a partir do primeiro foco do formulário) e envia `antiBot: { token, nonce }`.
        O token vale de `minFillSeconds` a `expiresInSeconds` depois de emitido e só uma vez
        (contracts/validation.json → waitlist.antiBot).
        Dificuldade adaptativa: a rede de origem com `waitlist.limits.elevatedAfterPerIpPerHour` ou mais cadastros
        aceitos na última hora recebe `difficultyBits = waitlist.antiBot.elevatedDifficultyBits` (redes compartilhadas,
        como o CGNAT das operadoras, não são barradas cedo). Um token mais fácil emitido antes disso é recusado no envio
        com `400 form_expired`; o site pede outro e reenvia uma vez.
      responses:
        '200': { description: Desafio., content: { application/json: { schema: { $ref: '#/components/schemas/FormToken' } } } }
        '429': { $ref: '#/components/responses/RateLimited' }

  # ---------------------------------------------------------------------------------------------- cadastro
  /api/waitlist:
    post:
      tags: [ cadastro ]
      summary: Cadastro de interesse pelo site (nome completo, CPF, WhatsApp, empregador e dados gerais). Sem confirmação por WhatsApp.
      description: |
        Resposta `201` IDÊNTICA para CPF/telefone novo, já cadastrado, suprimido ou campo-armadilha preenchido: não revela
        cadastro. O cadastro novo nasce `received` (telefone não validado) e passa a `verified` quando a própria pessoa
        fala com a Bia no WhatsApp oficial (ferramenta `upsert_customer`). Dados de um cadastro existente (mesmo telefone
        ou mesmo CPF) **não são sobrescritos**: a submissão fica guardada à parte, cifrada, para revisão.

        Ordem: campo-armadilha `website` preenchido → `201` sem gravar; validação estrita (`400 validation_error`); versões
        de consentimento (`409`); anti-robô (assinatura, idade, prova de trabalho, uso único → `400 form_expired`: pegue
        outro token e reenvie uma vez, sem perder o que foi digitado); limites de contracts/validation.json →
        waitlist.limits por IP/hora, CPF/dia e telefone/dia (`429 rate_limited`). Erros de validação e limite não
        consomem o token.

        CPF, telefone, e-mail e empregador são cifrados (AES-256-GCM, contexto por campo); CPF e telefone têm chave HMAC de
        deduplicação; faixas e UF ficam em claro (códigos). Nada disso em logs, URLs ou métricas.
        Placeholder da Hal-AI (desligado por padrão): com HALAI_SIGNUP_TEMPLATE_ENABLED=true, um cadastro NOVO pode enfileirar
        um template, só depois das travas anti-robô, uma vez por número em 30 dias e dentro do teto diário global.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WaitlistRequest' }
      responses:
        '201':
          description: Recebido (resposta genérica).
          content: { application/json: { schema: { $ref: '#/components/schemas/WaitlistReceived' } } }
        '400': { description: '`validation_error` (`fields`: `cpf` → "Confira o CPF.", `phone` → "Confira o DDD e o número.", …) ou `form_expired`.', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: 'Versão de texto de consentimento desatualizada (`consent_version_outdated`): recarregar a página.', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { description: 'Coleta indisponível (`collection_unavailable`): identidade empresarial incompleta em homologação/produção.', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  # ---------------------------------------------------------------------------------------- preferências
  /api/preferences/opt-out:
    post:
      tags: [ preferencias ]
      summary: Pedido de saída pelo número, sem sessão. Resposta sempre genérica; não mostra nada.
      description: |
        Se o número tiver cadastro, revoga o aviso de abertura e as novidades (estado `unsubscribed`), com trilha. Número sem
        cadastro recebe a mesma resposta. Anti-robô igual ao do cadastro (`antiBot`, campo-armadilha `website` → `202` sem
        gravar) e limite `waitlist.limits.optOutPerIpPerHour`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OptOutRequest' }
      responses:
        '202': { description: Pedido registrado (resposta genérica)., content: { application/json: { schema: { $ref: '#/components/schemas/OptOutReceived' } } } }
        '400': { description: '`validation_error` (`phone` → "Confira o DDD e o número.") ou `form_expired`.', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/preferences/token:
    post:
      tags: [ preferencias ]
      summary: Troca o token do link seguro gerado pela Bia (issue_preferences_link; lido do fragmento da URL) por sessão.
      description: Uso único; validade de `waitlist.preferencesLinkTtlSeconds`. Não há acesso por código (D1).
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [ token ], properties: { token: { type: string, minLength: 20, maxLength: 100 } } }
      responses:
        '200': { description: Sessão aberta (cookie mf_contact)., content: { application/json: { schema: { type: object, properties: { status: { const: ok } } } } } }
        '401': { description: '`invalid_or_expired_link`.', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /api/preferences:
    get:
      tags: [ preferencias ]
      summary: Lê as escolhas e os dados do titular, mascarados (somente com sessão válida).
      responses:
        '200': { description: Preferências., content: { application/json: { schema: { $ref: '#/components/schemas/Preferences' } } } }
        '401': { description: '`session_required` — orientar o link seguro pela Bia ou o pedido de saída, sem revelar dados.', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    patch:
      tags: [ preferencias ]
      summary: Altera finalidades, tema de interesse e dados gerais (faixas, cidade/UF, e-mail). Revogar `launch_notice` tira o contato da lista.
      description: CPF, telefone, nome e empregador não mudam por aqui (Bia com número atestado ou equipe de privacidade).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PreferencesPatch' }
      responses:
        '200': { description: Preferências atualizadas., content: { application/json: { schema: { $ref: '#/components/schemas/Preferences' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { description: '`session_required`.', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: '`consent_version_outdated`.', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /api/preferences/deletion-request:
    post:
      tags: [ preferencias ]
      summary: Registra pedido de exclusão dos dados do titular (cumprido pela equipe de privacidade).
      responses:
        '202': { description: Pedido registrado., content: { application/json: { schema: { type: object, properties: { status: { const: received }, message: { type: string } } } } } }
        '401': { description: '`session_required`.', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /api/preferences/logout:
    post:
      tags: [ preferencias ]
      summary: Encerra a sessão do titular.
      responses:
        '204': { description: Sessão encerrada. }

  # ------------------------------------------------------------------------------------------ atendimento
  /api/support:
    post:
      tags: [ atendimento ]
      summary: Registra solicitação de atendimento, gera protocolo aleatório e encaminha à fila interna.
      description: |
        A solicitação é persistida antes de qualquer notificação; falha de notificação não apaga o registro.
        O `trackingToken` é devolvido uma única vez e permite acompanhar o status; o protocolo sozinho não autoriza leitura.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SupportRequest' }
      responses:
        '201': { description: Solicitação registrada., content: { application/json: { schema: { $ref: '#/components/schemas/SupportCreated' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { description: '`support_unavailable`.', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /api/support/{protocol}:
    get:
      tags: [ atendimento ]
      summary: Consulta o status de uma solicitação. Exige o token de acompanhamento do titular.
      parameters:
        - { in: path, name: protocol, required: true, schema: { type: string, pattern: '^MF-[0-9A-Z]{4}-[0-9A-Z]{4}-[0-9A-Z]{2}$' } }
        - { in: header, name: X-Support-Token, required: true, schema: { type: string } }
      responses:
        '200': { description: Status da solicitação., content: { application/json: { schema: { $ref: '#/components/schemas/SupportStatus' } } } }
        '404': { description: 'Protocolo inexistente ou token inválido (mesma resposta: `not_found`).', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '429': { $ref: '#/components/responses/RateLimited' }

  # --------------------------------------------------------------------------------------------- métricas
  /api/events:
    post:
      tags: [ metricas ]
      summary: Evento de produto agregado, sem identificadores. Ignorado quando ANALYTICS_ENABLED=false.
      description: |
        O frontend só envia com consentimento de cookies de medição. Nunca contém dado pessoal ou texto livre.
        Cada nome tem um tipo de dimensão em contracts/validation.json → events.names, e cada tipo uma lista fechada
        montada pelo servidor a partir do release: `route` (caminho de rota indexável de
        frontend/src/router/manifest.ts, como `/` ou `/ajuda`, ou `/conteudos/<slug>` de artigo publicado),
        `article_slug`, `faq_category` (ou ausente = todas), `waitlist_source`, `bia_example_id` e `none` (sem
        dimensão). Dimensão fora da lista do evento → 400 `validation_error` em `fields.dimension`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductEvent' }
      responses:
        '204': { description: Aceito (ou ignorado). }
        '400': { $ref: '#/components/responses/ValidationError' }

  # ------------------------------------------------------------------------------------------------- Bia
  /api/agent/capabilities:
    get:
      tags: [ bia ]
      summary: Ferramentas disponíveis para a Bia na fase vigente, textos de consentimento e opções do formulário.
      security: [ { agentApiKey: [] } ]
      parameters:
        - { in: header, name: X-API-Key, required: true, schema: { type: string }, description: HALAI_INBOUND_API_KEY. }
        - { in: header, name: X-MF-Timestamp, required: false, schema: { type: string, pattern: '^\d{10}$' }, description: 'Somente com assinatura configurada (HALAI_WEBHOOK_SECRET).' }
        - { in: header, name: X-MF-Signature, required: false, schema: { type: string }, description: 'Somente com assinatura configurada: v1=<hex HMAC-SHA256(HALAI_WEBHOOK_SECRET, "<timestamp>.")> (corpo vazio).' }
      responses:
        '200': { description: Capacidades., content: { application/json: { schema: { $ref: '#/components/schemas/AgentCapabilities' } } } }
        '401': { description: '`invalid_api_key` (ou `invalid_signature` com assinatura configurada).', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '503': { description: '`agent_disabled` (HALAI_ENABLED=false ou HALAI_INBOUND_API_KEY ausente).', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  # ----------------------------------------------------------------------------------------------- crédito
  /api/credit/{operation}:
    parameters:
      - { in: path, name: operation, required: true, schema: { type: string, enum: [ eligibility, margin, simulations, proposals, contracts ] } }
    get:
      tags: [ credito ]
      summary: Reservado. Nenhuma operação financeira nesta entrega.
      responses:
        '403': { description: '`credit_phase_locked` em PRE_LAUNCH.', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '503': { description: '`credit_unavailable` em PILOT/LIVE sem integração homologada.', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    post:
      tags: [ credito ]
      summary: Reservado. Nenhuma operação financeira nesta entrega.
      responses:
        '403': { description: '`credit_phase_locked` em PRE_LAUNCH.', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '503': { description: '`credit_unavailable`.', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  # ------------------------------------------------------------------------------------------------ admin
  /api/admin/auth/login:
    post:
      tags: [ admin ]
      summary: Primeiro fator (e-mail e senha). Abre sessão parcial que exige MFA.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [ email, password ], properties: { email: { type: string, format: email, maxLength: 200 }, password: { type: string, maxLength: 200 } } }
      responses:
        '200':
          description: 'Senha correta; próximo passo: `mfa_required` ou `mfa_setup_required`. Cookie mf_admin (Path=/api/admin).'
          content: { application/json: { schema: { $ref: '#/components/schemas/AdminLoginStep' } } }
        '401': { description: '`invalid_credentials` (genérico, inclusive conta bloqueada/desativada).', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/admin/auth/mfa/setup:
    post:
      tags: [ admin ]
      summary: Inicia o cadastro do TOTP (somente sessão parcial de usuário sem MFA). Exige X-CSRF-Token.
      parameters: [ { $ref: '#/components/parameters/Csrf' } ]
      responses:
        '200': { description: Segredo e QR para o aplicativo autenticador., content: { application/json: { schema: { $ref: '#/components/schemas/MfaSetup' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { description: '`mfa_already_enabled`.', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /api/admin/auth/mfa/verify:
    post:
      tags: [ admin ]
      summary: Segundo fator (código TOTP). Conclui o cadastro do MFA quando pendente e libera a sessão.
      description: |
        Falhas de MFA têm contador próprio por conta (5 a cada 15 minutos), que um novo login com senha correta não
        zera. A quinta falha bloqueia a conta por 15 minutos (429 `rate_limited`); conta bloqueada não confere código.
      parameters: [ { $ref: '#/components/parameters/Csrf' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [ code ], properties: { code: { type: string, pattern: '^\d{6}$' } } }
      responses:
        '200': { description: Sessão completa., content: { application/json: { schema: { $ref: '#/components/schemas/AdminSession' } } } }
        '400': { description: '`invalid_code`.', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/admin/auth/me:
    get:
      tags: [ admin ]
      summary: Sessão atual (usuário, permissões e token CSRF). Sessão parcial devolve o passo pendente.
      responses:
        '200': { description: Sessão., content: { application/json: { schema: { oneOf: [ { $ref: '#/components/schemas/AdminSession' }, { $ref: '#/components/schemas/AdminLoginStep' } ] } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/admin/auth/logout:
    post:
      tags: [ admin ]
      summary: Encerra a sessão administrativa.
      parameters: [ { $ref: '#/components/parameters/Csrf' } ]
      responses:
        '204': { description: Encerrada. }

  /api/admin/auth/password:
    post:
      tags: [ admin ]
      summary: Troca a própria senha (mínimo 12 caracteres). Obrigatória no primeiro acesso.
      parameters: [ { $ref: '#/components/parameters/Csrf' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [ currentPassword, newPassword ], properties: { currentPassword: { type: string, maxLength: 200 }, newPassword: { type: string, minLength: 12, maxLength: 200 } } }
      responses:
        '204': { description: Senha alterada; outras sessões do usuário são encerradas. }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/admin/leads:
    get:
      tags: [ admin ]
      summary: Lista cadastros com filtros (permissão leads:read). Telefone, CPF e e-mail sempre mascarados.
      description: |
        Nome, empregador, faixas e UF/cidade visíveis para leads:read. Cada consulta é auditada (`admin.leads_listed`, com
        filtros, página e quantidade; sem dados do titular).
      parameters:
        - { in: query, name: from, schema: { type: string, format: date } }
        - { in: query, name: to, schema: { type: string, format: date } }
        - { in: query, name: state, schema: { $ref: '#/components/schemas/LeadState' } }
        - { in: query, name: source, schema: { type: string } }
        - { in: query, name: employmentType, schema: { $ref: '#/components/schemas/EmploymentType' } }
        - { in: query, name: jobTenure, schema: { $ref: '#/components/schemas/JobTenure' } }
        - { in: query, name: incomeRange, schema: { $ref: '#/components/schemas/IncomeRange' } }
        - { in: query, name: uf, schema: { $ref: '#/components/schemas/Uf' } }
        - { in: query, name: phoneVerified, schema: { type: string, enum: [ 'true', 'false' ] }, description: 'Telefone validado (a própria pessoa falou com a Bia).' }
        - { in: query, name: purpose, schema: { type: string, enum: [ launch_notice, marketing ] } }
        - { in: query, name: granted, schema: { type: string, enum: [ 'true', 'false' ] } }
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
        - { in: query, name: pageSize, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        '200':
          description: Página de cadastros.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/AdminLead' } }
                  total: { type: integer }
                  page: { type: integer }
                  pageSize: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/admin/leads/{id}:
    get:
      tags: [ admin ]
      summary: Detalhe do cadastro com trilha de eventos e submissões pendentes de revisão, mascaradas (leads:read).
      parameters: [ { in: path, name: id, required: true, schema: { type: string, format: uuid } } ]
      responses:
        '200': { description: Detalhe., content: { application/json: { schema: { $ref: '#/components/schemas/AdminLeadDetail' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/admin/leads/{id}/reveal-contact:
    post:
      tags: [ admin ]
      summary: Revela telefone, e-mail e CPF (leads:read_contact). Exige justificativa; registrado em auditoria (sem os valores).
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/Csrf' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [ reason ], properties: { reason: { type: string, minLength: 5, maxLength: 200 } } }
      responses:
        '200': { description: Contato e documento., content: { application/json: { schema: { $ref: '#/components/schemas/RevealedContact' } } } }
        '409': { description: '`lead_anonymized`.', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/admin/leads/{id}/submissions/{submissionId}/apply:
    post:
      tags: [ admin ]
      summary: Aplica ao cadastro uma submissão guardada (privacy:manage). Justificativa obrigatória; auditado.
      description: |
        Muda só dados cadastrais (nome, CPF, e-mail, empregador, vínculo, tempo no emprego, faixa de renda, cidade/UF,
        tema de interesse). Nunca o telefone nem as preferências de comunicação. E-mail e tema ausentes não apagam o
        existente. `cpf_conflict` e `suppressed` não se aplicam (só descartar). Depois da revisão, o conteúdo cifrado da
        submissão é apagado.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
        - { in: path, name: submissionId, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/Csrf' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [ reason ], properties: { reason: { type: string, minLength: 5, maxLength: 200 } } }
      responses:
        '200': { description: Aplicada., content: { application/json: { schema: { $ref: '#/components/schemas/SubmissionReviewResult' } } } }
        '404': { description: 'Cadastro ou submissão não encontrados (ou submissão de outro cadastro).', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: '`submission_already_reviewed`, `submission_not_applicable`, `cpf_in_use` ou `lead_anonymized`.', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/admin/leads/{id}/submissions/{submissionId}/discard:
    post:
      tags: [ admin ]
      summary: Descarta uma submissão guardada (privacy:manage). Justificativa obrigatória; auditado; conteúdo apagado.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
        - { in: path, name: submissionId, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/Csrf' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [ reason ], properties: { reason: { type: string, minLength: 5, maxLength: 200 } } }
      responses:
        '200': { description: Descartada., content: { application/json: { schema: { $ref: '#/components/schemas/SubmissionReviewResult' } } } }
        '404': { description: 'Cadastro ou submissão não encontrados.', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: '`submission_already_reviewed`.', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/admin/collection:
    get:
      tags: [ admin ]
      summary: Estado do formulário de cadastro do site (collection:manage, só admin).
      responses:
        '200': { description: Estado., content: { application/json: { schema: { $ref: '#/components/schemas/CollectionView' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/admin/collection/waitlist-form:
    put:
      tags: [ admin ]
      summary: Pausa ou reabre o formulário de cadastro do site (collection:manage). Justificativa obrigatória; auditado.
      description: |
        Pausado: `POST /api/waitlist` responde `503 collection_unavailable` e `/api/public-config` passa
        `collection.waitlistEnabled=false` (o site mostra o aviso de indisponível em até ~30 s). A Bia (telefone
        atestado) e o pedido de saída continuam. Com `WAITLIST_FORM_ENABLED=false` no servidor, reabrir não tem efeito
        (`lockedByEnvironment`).
      parameters: [ { $ref: '#/components/parameters/Csrf' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ paused, reason ]
              properties:
                paused: { type: boolean }
                reason: { type: string, minLength: 5, maxLength: 200 }
      responses:
        '200': { description: Estado depois da mudança., content: { application/json: { schema: { $ref: '#/components/schemas/CollectionView' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/admin/leads/export:
    post:
      tags: [ admin ]
      summary: Exporta CSV filtrado (leads:export). Justificativa obrigatória; auditado. Telefone, CPF e e-mail mascarados.
      parameters: [ { $ref: '#/components/parameters/Csrf' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ reason ]
              properties:
                reason: { type: string, minLength: 5, maxLength: 200 }
                filters: { type: object, additionalProperties: { type: string } }
      responses:
        '200': { description: CSV (text/csv; charset=utf-8). }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/admin/support:
    get:
      tags: [ admin ]
      summary: Fila de atendimento (support:read).
      description: Cada consulta é auditada (`admin.support_listed`, com filtros, página e quantidade; sem dados do titular).
      parameters:
        - { in: query, name: status, schema: { $ref: '#/components/schemas/SupportState' } }
        - { in: query, name: assignee, schema: { type: string, description: 'uuid, "me" ou "none"' } }
        - { in: query, name: from, schema: { type: string, format: date } }
        - { in: query, name: to, schema: { type: string, format: date } }
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
        - { in: query, name: pageSize, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        '200':
          description: Página da fila.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/AdminSupportItem' } }
                  total: { type: integer }
                  page: { type: integer }
                  pageSize: { type: integer }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/admin/support/{id}:
    get:
      tags: [ admin ]
      summary: Detalhe com mensagem e contato decifrados (support:read); acesso auditado.
      parameters: [ { in: path, name: id, required: true, schema: { type: string, format: uuid } } ]
      responses:
        '200': { description: Detalhe., content: { application/json: { schema: { $ref: '#/components/schemas/AdminSupportDetail' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [ admin ]
      summary: Altera status e/ou responsável (support:update). Registra responsável e horário.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/Csrf' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                status: { $ref: '#/components/schemas/SupportState' }
                assigneeId: { type: [ string, 'null' ], format: uuid }
      responses:
        '200': { description: Atualizado., content: { application/json: { schema: { $ref: '#/components/schemas/AdminSupportDetail' } } } }
        '400': { description: '`invalid_transition` ou validação.', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/admin/support/{id}/notes:
    post:
      tags: [ admin ]
      summary: Registra nota interna ou resposta visível ao titular no acompanhamento (support:update).
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/Csrf' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ note ]
              properties:
                note: { type: string, minLength: 1, maxLength: 2000 }
                visibleToRequester: { type: boolean, default: false }
      responses:
        '201': { description: Registrada., content: { application/json: { schema: { $ref: '#/components/schemas/AdminSupportDetail' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/admin/team:
    get:
      tags: [ admin ]
      summary: Pessoas ativas que podem ser responsáveis por atendimentos (team:read).
      responses:
        '200': { description: Equipe., content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/AdminUserRef' } } } } } } }

  /api/admin/privacy-requests:
    get:
      tags: [ admin ]
      summary: Pedidos de titulares (privacy:manage).
      parameters:
        - { in: query, name: status, schema: { type: string, enum: [ open, in_progress, fulfilled, rejected ] } }
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
      responses:
        '200':
          description: Lista.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/PrivacyRequest' } }
                  total: { type: integer }
                  page: { type: integer }
                  pageSize: { type: integer }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [ admin ]
      summary: Registra pedido recebido por outro canal (privacy:manage).
      parameters: [ { $ref: '#/components/parameters/Csrf' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ requestType, channel, summary, receivedAt ]
              properties:
                requestType: { $ref: '#/components/schemas/PrivacyRequestType' }
                leadId: { type: [ string, 'null' ], format: uuid }
                supportRequestId: { type: [ string, 'null' ], format: uuid }
                channel: { type: string, maxLength: 60 }
                summary: { type: string, minLength: 5, maxLength: 1000 }
                receivedAt: { type: string, format: date-time }
      responses:
        '201': { description: Registrado., content: { application/json: { schema: { $ref: '#/components/schemas/PrivacyRequest' } } } }

  /api/admin/privacy-requests/{id}:
    patch:
      tags: [ admin ]
      summary: Atualiza/cumpre o pedido. Ações irreversíveis exigem confirmação e são auditadas.
      description: |
        `action`: `revoke_all` (revoga todas as finalidades), `anonymize_lead` (remove nome, telefone, CPF, e-mail, empregador
        e cidade do cadastro, apaga as submissões guardadas para revisão com o mesmo telefone ou CPF, substitui dados de
        todas as solicitações de atendimento do titular — vinculadas ao cadastro, a do pedido e as com a mesma chave de
        contato, como as abertas pela Bia ou pelo site com o mesmo WhatsApp ou e-mail —, encerra sessões e cancela
        mensagens pendentes; os ids alcançados ficam na auditoria) e `suppress_contact` (impede novos envios ao
        número e do CPF, pelas chaves originais, mesmo após anonimização). Preferências do titular prevalecem.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/Csrf' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                status: { type: string, enum: [ open, in_progress, fulfilled, rejected ] }
                resolution: { type: string, maxLength: 1000 }
                action: { type: string, enum: [ revoke_all, anonymize_lead, suppress_contact ] }
                confirm: { type: boolean, description: 'Obrigatório (true) para anonymize_lead.' }
      responses:
        '200': { description: Atualizado., content: { application/json: { schema: { $ref: '#/components/schemas/PrivacyRequest' } } } }
        '400': { description: '`confirmation_required` ou validação.', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/admin/metrics:
    get:
      tags: [ admin ]
      summary: Métricas agregadas de cadastro, preferências e atendimento (metrics:read). Sem conteúdo de conversas.
      parameters:
        - { in: query, name: from, schema: { type: string, format: date } }
        - { in: query, name: to, schema: { type: string, format: date } }
      responses:
        '200': { description: Métricas., content: { application/json: { schema: { $ref: '#/components/schemas/AdminMetrics' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/admin/audit:
    get:
      tags: [ admin ]
      summary: Trilha de auditoria (audit:read).
      parameters:
        - { in: query, name: action, schema: { type: string } }
        - { in: query, name: actorId, schema: { type: string } }
        - { in: query, name: from, schema: { type: string, format: date } }
        - { in: query, name: to, schema: { type: string, format: date } }
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
      responses:
        '200':
          description: Página de eventos.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/AuditEntry' } }
                  total: { type: integer }
                  page: { type: integer }
                  pageSize: { type: integer }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/admin/users:
    get:
      tags: [ admin ]
      summary: Usuários do painel (users:manage).
      responses:
        '200': { description: Usuários., content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/AdminUser' } } } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [ admin ]
      summary: Cria usuário individual com senha temporária exibida uma única vez (users:manage).
      parameters: [ { $ref: '#/components/parameters/Csrf' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ email, displayName, role ]
              properties:
                email: { type: string, format: email, maxLength: 200 }
                displayName: { type: string, minLength: 2, maxLength: 80 }
                role: { $ref: '#/components/schemas/AdminRole' }
      responses:
        '201':
          description: Criado.
          content:
            application/json:
              schema: { type: object, properties: { user: { $ref: '#/components/schemas/AdminUser' }, temporaryPassword: { type: string } } }
        '409': { description: '`email_in_use`.', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /api/admin/users/{id}:
    patch:
      tags: [ admin ]
      summary: Altera papel, desativa, redefine senha ou MFA (users:manage). Não permite remover o último admin.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/Csrf' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                role: { $ref: '#/components/schemas/AdminRole' }
                disabled: { type: boolean }
                resetPassword: { type: boolean }
                resetMfa: { type: boolean }
      responses:
        '200':
          description: Atualizado.
          content:
            application/json:
              schema: { type: object, properties: { user: { $ref: '#/components/schemas/AdminUser' }, temporaryPassword: { type: string } } }
        '409': { description: '`last_admin`.', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/agent/tools/get_approved_faq:
    post:
      tags:
        - bia
      operationId: agent_get_approved_faq
      summary: Busca na base aprovada de perguntas frequentes (frontend/content/faq.yaml, a mesma de /ajuda).
      description: |-
        Busca na base aprovada de perguntas frequentes (frontend/content/faq.yaml, a mesma de /ajuda). Sem correspondência, found=false e items vazio: a Bia diz que não tem confirmação e oferece atendimento.

        Fases permitidas: PRE_LAUNCH, PILOT, LIVE.

        Contrato PROPOSTO (a confirmar com o fornecedor Hal-AI). Esquemas também em contracts/agent-tools.json.
      security:
        - agentApiKey: []
      parameters:
        - in: header
          name: X-API-Key
          required: true
          schema:
            type: string
          description: HALAI_INBOUND_API_KEY (comparação em tempo constante).
        - in: header
          name: X-MF-Timestamp
          required: false
          schema:
            type: string
            pattern: ^\d{10}$
          description: "Somente com assinatura configurada (HALAI_WEBHOOK_SECRET): epoch em segundos; tolerância de 300 s."
        - in: header
          name: X-MF-Signature
          required: false
          schema:
            type: string
          description: 'Somente com assinatura configurada: v1=<hex HMAC-SHA256(HALAI_WEBHOOK_SECRET, "<timestamp>.<corpo bruto>")>; lista separada por vírgula na rotação.'
        - in: header
          name: X-MF-Request-Id
          required: false
          schema:
            type: string
            pattern: ^[A-Za-z0-9._:-]{8,128}$
          description: Obrigatório com assinatura; opcional sem ela. Único por chamada; repetição → 409 replayed_request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/AgentToolEnvelope"
                - type: object
                  properties:
                    input:
                      $ref: "#/components/schemas/AgentInputGetApprovedFaq"
            examples:
              exemplo1:
                value:
                  conversationRef: conv-exemplo
                  input:
                    query: A Minha Folga já está liberando empréstimo?
              exemplo2:
                value:
                  conversationRef: conv-exemplo
                  input:
                    query: qual a taxa de juros para aposentado do INSS
              exemplo3:
                value:
                  conversationRef: conv-exemplo
                  input:
                    category: cadastro
                    limit: 5
      responses:
        "200":
          description: Resultado da ferramenta.
          content:
            application/json:
              schema:
                type: object
                required:
                  - ok
                  - tool
                  - result
                properties:
                  ok:
                    const: true
                  tool:
                    const: get_approved_faq
                  result:
                    $ref: "#/components/schemas/AgentOutputGetApprovedFaq"
              examples:
                exemplo1:
                  value:
                    ok: true
                    tool: get_approved_faq
                    result:
                      found: true
                      baseVersion: faq.v1.draft
                      baseStatus: draft
                      items:
                        - id: ja-libera-emprestimos
                          category: consignado
                          categoryLabel: Consignado
                          question: A Minha Folga já está liberando empréstimos?
                          answer: Ainda não. Estamos estruturando a operação. Nesta fase, você pode tirar dúvidas e se cadastrar para receber o aviso de abertura.
                          helpUrl: https://www.minhafolga.com.br/ajuda
                          links:
                            - label: Acompanhe a abertura financeira
                              url: https://www.minhafolga.com.br/lancamento
                            - label: Quero ser avisado
                              url: https://www.minhafolga.com.br/avise-me
                      categories:
                        - id: sobre
                          label: Sobre a Minha Folga
                        - id: consignado
                          label: Consignado
                        - id: cadastro
                          label: Cadastro e avisos
                        - id: bia
                          label: Bia
                        - id: dados
                          label: Dados e segurança
                      note: Responda somente com base nestes itens, em linguagem simples, e ofereça o link quando fizer sentido.
                exemplo2:
                  value:
                    ok: true
                    tool: get_approved_faq
                    result:
                      found: false
                      baseVersion: faq.v1.draft
                      baseStatus: draft
                      items: []
                      categories:
                        - id: sobre
                          label: Sobre a Minha Folga
                        - id: consignado
                          label: Consignado
                        - id: cadastro
                          label: Cadastro e avisos
                        - id: bia
                          label: Bia
                        - id: dados
                          label: Dados e segurança
                      note: Não há resposta aprovada para esta pergunta. Diga que não tem essa confirmação, não crie regra nem cite norma, e ofereça o atendimento.
        "400":
          description: "`validation_error (fields com o caminho, ex.: input.cpf)`, `validation_error (input.category inexistente)`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentToolError"
        "401":
          description: "`invalid_api_key`, `invalid_signature (com assinatura configurada)`, `stale_request (com assinatura configurada)`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentToolError"
        "404":
          description: "`not_found (ferramenta inexistente)`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentToolError"
        "409":
          description: "`replayed_request`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentToolError"
        "415":
          description: "`unsupported_media_type`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentToolError"
        "429":
          description: "`rate_limited`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentToolError"
        "500":
          description: "`internal_error`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentToolError"
        "503":
          description: "`agent_disabled`, `knowledge_base_unavailable`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentToolError"
  /api/agent/tools/upsert_customer:
    post:
      tags:
        - bia
      operationId: agent_upsert_customer
      summary: Cria ou atualiza o cadastro do PRÓPRIO remetente atestado (o telefone é senderPhone, nunca input), com os mesmos campos do formulário do site (/avise-me), e marca o número como validado (estado verified).
      description: |-
        Cria ou atualiza o cadastro do PRÓPRIO remetente atestado (o telefone é senderPhone, nunca input), com os mesmos campos do formulário do site (/avise-me), e marca o número como validado (estado verified). Para criar: fullName, cpf, employerName, employmentType, jobTenure, incomeRange, city, uf, ageConfirmed=true, consents.launch_notice=true, consents.marketing (true ou false conforme a resposta) e as duas versões de consentimento vigentes. Para atualizar: só os campos informados mudam. CPF de outro cadastro (outro telefone), CPF diferente do já cadastrado para este número ou contato suprimido → status needs_review, sem mesclar nem alterar nada (a equipe revisa). Peça o CPF só com o consentimento da pessoa e nunca o repita na conversa.

        Fases permitidas: PRE_LAUNCH, PILOT, LIVE. Exige remetente atestado pela plataforma (senderVerified).

        Contrato PROPOSTO (a confirmar com o fornecedor Hal-AI). Esquemas também em contracts/agent-tools.json.
      security:
        - agentApiKey: []
      parameters:
        - in: header
          name: X-API-Key
          required: true
          schema:
            type: string
          description: HALAI_INBOUND_API_KEY (comparação em tempo constante).
        - in: header
          name: X-MF-Timestamp
          required: false
          schema:
            type: string
            pattern: ^\d{10}$
          description: "Somente com assinatura configurada (HALAI_WEBHOOK_SECRET): epoch em segundos; tolerância de 300 s."
        - in: header
          name: X-MF-Signature
          required: false
          schema:
            type: string
          description: 'Somente com assinatura configurada: v1=<hex HMAC-SHA256(HALAI_WEBHOOK_SECRET, "<timestamp>.<corpo bruto>")>; lista separada por vírgula na rotação.'
        - in: header
          name: X-MF-Request-Id
          required: false
          schema:
            type: string
            pattern: ^[A-Za-z0-9._:-]{8,128}$
          description: Obrigatório com assinatura; opcional sem ela. Único por chamada; repetição → 409 replayed_request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/AgentToolEnvelope"
                - type: object
                  properties:
                    input:
                      $ref: "#/components/schemas/AgentInputUpsertCustomer"
            examples:
              exemplo1:
                value:
                  conversationRef: conv-exemplo
                  senderPhone: "+5511999999999"
                  senderVerified: true
                  input:
                    fullName: Pessoa de Exemplo Silva
                    cpf: 529.982.247-25
                    employerName: Empresa Exemplo
                    employmentType: clt
                    jobTenure: 1_a_3_anos
                    incomeRange: 2000_a_4000
                    city: São Paulo
                    uf: SP
                    ageConfirmed: true
                    consents:
                      launch_notice: true
                      marketing: false
                    consentVersions:
                      launch_notice: launch_notice.2026-09-25.1
                      marketing: marketing.2026-09-25.1
              exemplo2:
                value:
                  conversationRef: conv-exemplo
                  senderPhone: "+5511999999999"
                  senderVerified: true
                  input:
                    email: pessoa@exemplo.invalid
                    incomeRange: nao_informar
              exemplo3:
                value:
                  conversationRef: conv-exemplo
                  senderPhone: "+5511999999999"
                  senderVerified: true
                  input:
                    cpf: 111.444.777-35
      responses:
        "200":
          description: Resultado da ferramenta.
          content:
            application/json:
              schema:
                type: object
                required:
                  - ok
                  - tool
                  - result
                properties:
                  ok:
                    const: true
                  tool:
                    const: upsert_customer
                  result:
                    $ref: "#/components/schemas/AgentOutputUpsertCustomer"
              examples:
                exemplo1:
                  value:
                    ok: true
                    tool: upsert_customer
                    result:
                      status: created
                      message: Pronto, seu cadastro ficou registrado. Vamos avisar quando a análise estiver disponível.
                      employmentNotice: null
                      contactVerified: true
                      state: verified
                      purposes:
                        launch_notice: true
                        marketing: false
                      interestTopic: null
                      customer:
                        nameHint: Pessoa E. S.
                        cpfHint: "***.***.***-25"
                        emailHint: null
                        employerName: Empresa Exemplo
                        employmentType: clt
                        jobTenure: 1_a_3_anos
                        incomeRange: 2000_a_4000
                        city: São Paulo
                        uf: SP
                exemplo3:
                  value:
                    ok: true
                    tool: upsert_customer
                    result:
                      status: needs_review
                      message: Recebi seus dados, mas a equipe da Minha Folga precisa conferir algumas informações antes de concluir. Não é preciso enviar de novo.
        "400":
          description: '`validation_error (fields com o caminho, ex.: input.cpf)`, `validation_error (ex.: input.cpf "Confira o CPF."; campos obrigatórios para criar)`'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentToolError"
        "401":
          description: "`invalid_api_key`, `invalid_signature (com assinatura configurada)`, `stale_request (com assinatura configurada)`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentToolError"
        "403":
          description: "`sender_not_verified (com alternativeUrl para /avise-me)`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentToolError"
        "404":
          description: "`not_found (ferramenta inexistente)`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentToolError"
        "409":
          description: "`replayed_request`, `consent_version_outdated`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentToolError"
        "415":
          description: "`unsupported_media_type`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentToolError"
        "429":
          description: "`rate_limited`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentToolError"
        "500":
          description: "`internal_error`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentToolError"
        "503":
          description: "`agent_disabled`, `collection_unavailable`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentToolError"
